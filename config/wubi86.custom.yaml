patch:
  switches/@0:
    name: ascii_mode
    states: [中文, 西文]
  translator/enable_completion: false #  提前顯示尚未輸入完整碼的字〔僅table_translator有效〕
  translator/enable_sentence: false # 是否開啓自動造句
  translator/enable_user_dict: false # 是否開啓用戶詞典〔用戶詞典記錄動態字詞頻、用戶詞〕
  speller/max_code_length: 4  # 形碼最大碼長，超過則頂字上屛〔number〕
  speller/auto_select: true # 自動上屛, 等价于原本的 auto_select_unique_candidate，详见 <https://github.com/rime/home/issues/362#issuecomment-487254079>
  engine/translators/+:
    - lua_translator@date_translator # 自定义系统变量输出
    - lua_translator@calculator # 计算器：二元运算，coco 开头，如 coco56*34 coco24/1024
    - table_translator@custom_phrase
  recognizer/patterns/+:
    calculator: "^coco.*$" # 计算器

  key_binder/bindings:
    - { when: has_menu, accept: semicolon, send: 2 }
    - { when: has_menu, accept: apostrophe, send: 3 }

  #menu/page_size: 7

  custom_phrase:
    dictionary: ""
    user_dict: custom_phrase
    db_class: stabledb
    #enable_completion: false
    enable_sentence: false
    initial_quality: 1

  punctuator/half_shape:
      '\': 、
      '#': '#'
      '=': '='
      '<': '《'
      '>': '》'
      # '$': '$'
      # '%': '%'
  # preset symbols refer to https://github.com/rime/librime/blob/master/data/minimal/symbols.yaml
  'punctuator/symbols/+' :
    # Emoji shortcuts
    '/xk': ["😂", "🤣"] #笑哭
    '/kx': [ '😇', '😁', '😀', '😊', '^_^', ':-)'] #开心
    '/kn': ['>_<'] #苦恼
    '/gg': ['-_-', '😅'] #尴尬
    '/pb': ['=_='] #疲惫
    '/xh': ['😍', '🥰', '😘'] #喜欢
    '/ts': ['😛', '😝', '😜'] #吐舌
    '/xu': ['🤫'] #嘘
    '/dy': ['😏'] #得意
    '/sj': ['😪', '😴'] #睡觉
    '/bs': ['😷', '🤮'] #不适
    '/ku': ['😎'] #酷
    '/dk': ['😭'] #大哭
    '/kp': ['😱'] #可怕
    '/wy': ['😓'] #无语
    '/ss': ['👍', '👌', '✌️'] #手势
    # custom shortcuts
    '/sjh': 17815162858
    '/qqyx': wsxq2@qq.com
    '/ggyx': wsxq222222@gmail.com
    '/qqh': 2667184828
    # Here, the letter name is used as the code of the Greek letter, and you can replace it with your favorite code as needed.
    # For example, if you want to use a as the alpha code
    # just replace the alpha below with a
    "/alpha": ["Α", "α"]
    "/beta": ["Β", "β"]
    "/gamma": ["Γ", "γ"]
    "/delta": ["Δ", "δ"]
    "/epsilon": ["Ε", "ε"]
    "/zeta": ["Ζ", "ζ"]
    "/eta": ["Η", "η"]
    "/theta": ["Θ", "θ"]
    "/iota": ["Ι", "ι"]
    "/kappa": ["Κ", "κ"]
    "/lambda": ["Λ", "λ"]
    "/mu": ["Μ", "μ"]
    "/nu": ["Ν", "ν"]
    "/xi": ["Ξ", "ξ"]
    "/omicron": ["Ο", "ο"]
    "/pi": ["Π", "π"]
    "/rho": ["Ρ","ρ"]
    "/sigma": ["Σ", "σ", "ς"]
    "/tau": ["Τ", "τ"]
    "/upsilon": ["Υ", "υ"]
    "/phi": ["Φ", "φ"]
    "/chi": ["Χ", "χ"]
    "/psi": ["Ψ", "ψ"]
    "/omega": ["Ω", "ω"]

